<script>
  document.addEventListener('DOMContentLoaded', function() {
      const links = document.querySelectorAll('.navigation-links-nav a');
      // Check local storage for an active link
      const activeLink = localStorage.getItem('activeLink');
      const footerLinks = document.querySelectorAll('.footer-links'); // Select footer links
      const aboutLink = document.getElementById('about');
      console.log(activeLink);
      if (activeLink) {
          // Apply the bold class to the active link
          links.forEach(link => {
              if (link.href === activeLink) {

                  link.classList.add('clicked-link');
              }
          });
      }
      links.forEach(link => {
          link.addEventListener('click', function() {
              // Remove bold class from all links
              links.forEach(l => l.classList.remove('clicked-link'));
              
              // Add bold class to the clicked link
              this.classList.add('clicked-link');

              // Store the active link in local storage
              localStorage.setItem('activeLink', this.href);
          });
      });
        // Add click event for footer links
        footerLinks.forEach(link1 => {
            link1.addEventListener('click', function() {
                links.forEach(l => l.classList.remove('clicked-link')); // Remove clicked class
                aboutLink.classList.add('clicked-link'); // Add clicked class to About link
                localStorage.setItem('activeLink', "/index.html"); // Adjust the link as necessary
            });
        });
    });
</script>

<h2 class="title" id="tool-type-title">Text</h2>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        const typeFromURL = urlParams.get('type') || "text";
        const toolLinks = document.querySelectorAll('.tool-type');
        const toolsTable = document.getElementById('tools-table');
        const toolsRows = toolsTable.querySelectorAll('.tool-row');
        // Initially display only the default type tools
        toolsRows.forEach(row => {
            if (row.getAttribute('data-type') === typeFromURL) {
                row.style.display = ''; // Show the row
            } else {
                row.style.display = 'none'; // Hide the row
            }
        });
        // Highlight the default link
        toolLinks.forEach(link => {
            if (link.getAttribute('data-type') === typeFromURL) {
                link.classList.add('clicked-link'); // Add clicked-link class to the default type
            }
        });
       // Event listeners for tool links
        toolLinks.forEach(link => {
            link.addEventListener('click', function(event) {
                event.preventDefault(); // Prevent default anchor click behavior
                const selectedType = this.getAttribute('data-type');
                // Update the title
                document.getElementById('tool-type-title').textContent = this.textContent;
                // Show only the rows that match the selected type
                toolsRows.forEach(row => {
                    if (row.getAttribute('data-type') === selectedType) {
                        row.style.display = ''; // Show the row
                    } else {
                        row.style.display = 'none'; // Hide the row
                    }
                });
                // Remove active class from all links and add to the clicked link
                toolLinks.forEach(l => l.classList.remove('clicked-link'));
                this.classList.add('clicked-link');
                // Update the URL without refreshing the page
                window.history.pushState({}, '', `?type=${selectedType}`);
            });
        });
    });
</script>
